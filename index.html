<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2A8A4C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Verdulería">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<!--ART-START-->
<title>Verdulería al Peso</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --ground:#F3F6EC; --paper:#FFFFFF; --paper-2:#E9EFDD; --ink:#1B261E; --muted:#5C6A60; --line:#D3DCC6;
  --accent:#2A8A4C; --accent-ink:#FFFFFF; --accent-soft:#DAEFDF;
  --money:#E4791A; --money-ink:#FFFFFF; --money-soft:#FCE8D2;
  --ok:#2A8A4C; --warn:#C98E00; --bad:#CF3F3F; --off:#94A096;
  --shadow:0 4px 16px rgba(27,38,30,.07);
  --r:14px;
  --display:"Bricolage Grotesque","Trebuchet MS",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111813; --paper:#1A231D; --paper-2:#232E26; --ink:#EAF0E5; --muted:#9AA89D; --line:#2D3A31;
    --accent:#4DB877; --accent-ink:#0E1A12; --accent-soft:#1E3627;
    --money:#F09A3E; --money-ink:#1A1208; --money-soft:#3A2812;
    --ok:#4DB877; --warn:#E2B23C; --bad:#E86A6A; --off:#66736A;
    --shadow:0 4px 16px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#111813; --paper:#1A231D; --paper-2:#232E26; --ink:#EAF0E5; --muted:#9AA89D; --line:#2D3A31;
  --accent:#4DB877; --accent-ink:#0E1A12; --accent-soft:#1E3627;
  --money:#F09A3E; --money-ink:#1A1208; --money-soft:#3A2812;
  --ok:#4DB877; --warn:#E2B23C; --bad:#E86A6A; --off:#66736A;
  --shadow:0 4px 16px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.muted{color:var(--muted)}

/* ---------- Armazón ---------- */
.app{height:100%;display:flex;flex-direction:column}
header.barra{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex:none}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.marca .logo{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);flex:none}
.marca .logo svg{width:22px;height:22px}
.marca h1{font-family:var(--display);font-size:1.15rem;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.marca small{display:block;color:var(--muted);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
nav.pestanas{display:flex;gap:4px;margin-left:auto}
nav.pestanas button{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;color:var(--muted);font-weight:700;white-space:nowrap}
nav.pestanas button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.pestanas svg{width:20px;height:20px;flex:none}
nav.pestanas .solo-movil{display:none}
@media (max-width:699px){nav.pestanas .solo-movil{display:flex}}
#a-direccion{margin-left:auto}
#salir{margin-left:8px}
.app.caja{--nav-h:0px}
.perfiles{max-width:520px;margin:16px auto;display:flex;flex-direction:column;gap:12px}
.perfiles h2{font-family:var(--display);font-size:1.5rem;margin:0}
.perfil{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;box-shadow:var(--shadow);width:100%}
.perfil b{font-family:var(--display);font-size:1.2rem}
.perfil>b+span{color:var(--muted);font-size:.9rem;grid-column:2}
.entrada-form{grid-column:2;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.entrada-form input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--ground);min-height:44px;width:100%}
.hoja .entrada-form{grid-column:auto;margin-top:0}
.sel-suc{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-weight:700;max-width:200px;min-height:40px}
@media (max-width:699px){.app.con-sel .marca>div{display:none}}
.clave-caja{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clave-caja b{font-family:var(--display);font-size:1.6rem;letter-spacing:.12em;background:var(--paper-2);padding:6px 12px;border-radius:10px;font-variant-numeric:tabular-nums}
.lista-suc{display:flex;flex-direction:column;gap:6px}
.suc-fila{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.suc-fila.actual{border-color:var(--accent)}
.suc-fila b{font-family:var(--display)}
.suc-fila .muted{font-size:.85rem;margin-right:auto}
.dash-sel{max-width:260px;flex:1}
.enlace{color:var(--accent);font-weight:700;text-decoration:underline;padding:0}
.sub-suc{margin:8px 0 0;font-family:var(--display);font-size:.95rem;color:var(--muted)}
.perfil-icono{grid-row:1/3;width:52px;height:52px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.perfil-icono svg{width:28px;height:28px}
.perfil:active{transform:scale(.98)}
main{flex:1;min-height:0;overflow:auto;padding:16px}
@media (max-width:699px){
  #salir{display:none}
  nav.pestanas{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--paper);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:6}
  nav.pestanas button{flex-direction:column;gap:2px;font-size:.66rem;padding:6px 4px;border-radius:8px;flex:1;justify-content:center}
  main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px)}
  .app.en-vender main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 118px)}
}
@media (min-width:700px) and (max-width:899px){
  .app.en-vender main{padding-bottom:118px}
}

/* ---------- Botones y formularios ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;font-weight:700;background:var(--paper-2);color:var(--ink);border:1px solid transparent;min-height:42px;line-height:1.2}
.btn.chico{padding:6px 10px;min-height:34px;font-size:.85rem}
.btn.primario{background:var(--accent);color:var(--accent-ink)}
.btn.dinero{background:var(--money);color:var(--money-ink)}
.btn.peligro{color:var(--bad)}
.btn.borde{background:transparent;border-color:var(--line)}
.btn.grande{width:100%;min-height:52px;font-size:1.1rem;font-family:var(--display)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.botonera{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.botonera .btn{flex:1}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo label{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.campo input,.campo select,.campo textarea,textarea.plano{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--ground);min-height:44px;width:100%}
textarea{resize:vertical}
.campos-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ayuda{font-size:.85rem;color:var(--muted);margin:0}
.switch{width:46px;height:26px;border-radius:13px;background:var(--off);position:relative;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.segmento{display:flex;background:var(--paper-2);border-radius:10px;padding:3px}
.segmento button{flex:1;padding:8px;border-radius:8px;font-weight:700;color:var(--muted);text-align:center}
.segmento button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- Ilustraciones animadas ---------- */
.ilus{aspect-ratio:1;max-width:100%;display:grid;place-items:center;background:var(--paper-2);border-radius:10px;overflow:hidden;position:relative}
.ilus svg{width:82%;height:82%;overflow:visible;display:block}
.ilus .emoji{font-size:3rem;line-height:1;display:inline-block}
.ilus img{width:100%;height:100%;object-fit:cover;display:block}
.ilus.mini{width:64px;flex:none}
.ilus.mini .emoji{font-size:2rem}
.ilus svg [class^="anim-"]{transform-box:fill-box;transform-origin:50% 50%}
.anim-bob{animation:bob 2.6s ease-in-out infinite}
.anim-sway{animation:sway 3s ease-in-out infinite;transform-origin:50% 90%}
.anim-roll{animation:roll 3.4s ease-in-out infinite}
.anim-wobble{animation:wobble 2.8s ease-in-out infinite;transform-origin:50% 90%}
.anim-spin{animation:spin 3.2s ease-in-out infinite}
.anim-rustle{animation:rustle 2.4s ease-in-out infinite;transform-origin:50% 100%}
.anim-rustle2{animation:rustle 2.9s ease-in-out .6s infinite;transform-origin:50% 100%}
.ilus svg .anim-hoja{animation:hoja 2.6s ease-in-out infinite;transform-origin:0% 100%}
.ilus .emoji.anim-bob{transform-box:border-box}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes roll{0%,100%{transform:rotate(-6deg) translateX(-2px)}50%{transform:rotate(6deg) translateX(2px)}}
@keyframes wobble{0%,100%{transform:rotate(-3deg)}30%{transform:translateY(-2px) rotate(3deg)}70%{transform:translateY(1px) rotate(-1deg)}}
@keyframes spin{0%,100%{transform:rotate(0)}50%{transform:rotate(10deg)}}
@keyframes rustle{0%,100%{transform:skewX(0) rotate(0)}50%{transform:skewX(-4deg) rotate(2deg)}}
@keyframes hoja{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
@media (prefers-reduced-motion: reduce){[class^="anim-"],[class*=" anim-"],.ilus svg .anim-hoja{animation:none!important}}

/* ---------- Vender ---------- */
.vender{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;height:100%;min-height:0}
.catalogo{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:8px}
.buscar{display:flex;gap:10px;align-items:center}
.buscar input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);min-height:44px;min-width:0}
.buscar .cuenta{font-size:.85rem;color:var(--muted);white-space:nowrap}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tarjeta{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:transform .12s;width:100%}
.tarjeta:active{transform:scale(.97)}
.tarjeta .nombre{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.15;margin-top:2px}
.tarjeta .precio{font-family:var(--display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums;line-height:1.1}
.tarjeta .precio small{font-weight:600;font-size:.8rem;color:var(--muted)}
.nivel{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.nivel .barra-nivel{flex:1;height:6px;border-radius:3px;background:var(--paper-2);overflow:hidden}
.nivel .barra-nivel i{display:block;height:100%;border-radius:3px;background:var(--ok);transition:width .3s}
.nivel b{font-family:var(--display);font-size:.95rem;color:var(--ink);min-width:2ch;text-align:right}
[data-banda="ok"] .barra-nivel i{background:var(--ok)}
[data-banda="warn"] .barra-nivel i{background:var(--warn)}
[data-banda="bad"] .barra-nivel i{background:var(--bad)}
[data-banda="off"] .barra-nivel i{background:var(--off)}
[data-banda="bad"] .nivel b{color:var(--bad)}
.tarjeta.agotado .ilus{filter:grayscale(.85);opacity:.55}
.tarjeta.agotado .ilus [class^="anim-"]{animation-play-state:paused}
.etiqueta{position:absolute;top:16px;left:16px;z-index:1;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--bad);color:#fff}
.vacio{padding:24px 14px;color:var(--muted);text-align:center;font-size:.9rem}
.aviso{background:var(--money-soft);border:1px solid var(--money);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.aviso span{flex:1;min-width:200px}

/* ticket */
.ticket{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow)}
.ticket header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-family:var(--display);font-weight:700}
.ticket .lineas{flex:1;overflow:auto;min-height:0;padding:6px 0}
.linea{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 14px}
.linea .q{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.linea .imp{font-variant-numeric:tabular-nums;font-weight:700}
.linea .x{color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.linea .x:hover{background:var(--paper-2);color:var(--bad)}
.ticket footer{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--display)}
.total .lbl{color:var(--muted);font-weight:600;margin-left:auto}
.total b{font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums}
.ver-lineas{display:none;font-weight:700;color:var(--accent);padding:4px 8px;border-radius:8px;background:var(--accent-soft);font-size:.85rem}
@media (max-width:899px){
  .vender{grid-template-columns:minmax(0,1fr);height:auto}
  .catalogo{overflow:visible}
  .ticket{position:fixed;left:8px;right:8px;bottom:8px;z-index:5;max-height:70vh;max-width:720px;margin:0 auto}
  .ticket header,.ticket .lineas{display:none}
  .ticket.abierto header,.ticket.abierto .lineas{display:flex}
  .ticket.abierto .lineas{display:block;max-height:45vh}
  .ver-lineas{display:inline-block}
}
@media (max-width:699px){
  .ticket{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 6px)}
}

/* ---------- Dirección ---------- */
.direccion{display:flex;flex-direction:column;gap:12px;max-width:980px}
.acciones{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.acciones h2{font-family:var(--display);font-size:1.4rem;margin:0}
.acciones .espacio{flex:1}
.fila{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.fila .ilus{width:64px}
.fila .info{display:flex;flex-direction:column;gap:6px;min-width:0}
.fila .titulo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fila .titulo b{font-family:var(--display);font-size:1.1rem}
.fila .estado-txt{font-size:.8rem;color:var(--muted);font-weight:700}
.fila .datos{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.fila .datos b{color:var(--ink)}
.fila .botones{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.fila.apagada .ilus,.fila.apagada .titulo b{opacity:.55}
.fila.apagada .ilus [class^="anim-"]{animation-play-state:paused}
.precio-txt{font-family:var(--display);font-weight:700;color:var(--muted)}
.sub-titulo{font-family:var(--display);font-size:1.05rem;margin:6px 0 0}
.tabla-carga td,.tabla-carga th{vertical-align:middle;padding:6px 8px}
.prod-celda{display:inline-flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.celda-input{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--ground);font-weight:700}
.celda-input input{width:76px;border:0;background:none;font-family:var(--display);font-weight:700;font-size:1rem;text-align:right;padding:4px 0;min-height:34px;-moz-appearance:textfield}
.celda-input input::-webkit-outer-spin-button,.celda-input input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.celda-input small{color:var(--muted)}
.celda-input.doble input{width:64px}
.tabla-carga .nivel{min-width:96px}
.ilus.chica{width:36px;border-radius:8px;flex:none}
.ilus.chica .emoji{font-size:1.3rem}
@media (max-width:640px){
  .fila{grid-template-columns:56px minmax(0,1fr)}
  .fila .ilus{width:56px}
  .fila .botones{grid-column:1/-1;justify-content:flex-start}
}
.seccion{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.seccion h3{margin:0;font-family:var(--display);font-size:1.05rem}
.mov{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.mov:last-child{border-bottom:0}
.mov .tipo{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--paper-2);color:var(--muted)}
.mov .tipo.entrada{background:var(--accent-soft);color:var(--accent)}
.mov .tipo.venta{background:var(--money-soft);color:var(--money)}
.mov .cuando{color:var(--muted);font-size:.8rem;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- Corte ---------- */
.corte,.ajustes{display:flex;flex-direction:column;gap:12px;max-width:980px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile small{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.tile b{font-family:var(--display);font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.tabla-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:0}
details.tk{border-bottom:1px solid var(--line);padding:6px 0}
details.tk:last-child{border-bottom:0}
details.tk summary{cursor:pointer;display:flex;gap:12px;align-items:center;font-variant-numeric:tabular-nums;list-style:none}
details.tk summary::-webkit-details-marker{display:none}
details.tk summary .hora{font-weight:700;font-family:var(--display)}
details.tk summary .tot{margin-left:auto;font-weight:700}
details.tk .linea{padding:4px 0 4px 12px}
.corte input[type="date"]{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);min-height:42px}

/* ---------- Dashboard ---------- */
.dashboard{display:flex;flex-direction:column;gap:12px;max-width:1100px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-items:start}
.dash-grid .seccion.ancha{grid-column:1/-1}
.tile .delta{display:block;font-size:.8rem;color:var(--muted);min-height:1.2em;font-variant-numeric:tabular-nums}
.grafica{width:100%;height:auto;display:block;max-width:100%}
.g-linea{stroke:var(--line);stroke-width:1}
.g-base{stroke:var(--muted);stroke-width:1}
.g-eje{fill:var(--muted);font-size:12px;font-family:var(--body)}
.g-eje.fuerte{fill:var(--ink);font-weight:700}
.g-valor{fill:var(--ink);font-size:13px;font-weight:700;font-family:var(--display)}
.g-hit{fill:transparent}
.g-barra path{fill:var(--accent);opacity:.45;transition:opacity .15s}
.g-barra.hoy path,.g-barra:hover path{opacity:1}
.tabla-datos summary{cursor:pointer;font-size:.85rem;color:var(--muted);font-weight:700}
.barras-h{display:flex;flex-direction:column;gap:8px}
.bh{display:grid;grid-template-columns:minmax(72px,110px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.9rem}
.bh-nombre{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bh-pista{height:10px;background:var(--paper-2);border-radius:4px;overflow:hidden;display:block}
.bh-pista i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bh-valor{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.alerta-stock{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.alerta-stock:last-of-type{border-bottom:0}
.alerta-info{display:flex;flex-direction:column;gap:4px;min-width:0}
.estado-chip{font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--paper-2);color:var(--ink);white-space:nowrap}
.estado-chip.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
@media (max-width:560px){.alerta-stock{grid-template-columns:36px minmax(0,1fr)}.alerta-stock .estado-chip,.alerta-stock .btn{grid-column:2;justify-self:start}}
.tip{position:fixed;z-index:40;background:var(--ink);color:var(--ground);padding:6px 10px;border-radius:8px;font-size:.8rem;pointer-events:none;max-width:260px;box-shadow:var(--shadow)}

/* ---------- Ajustes ---------- */
.ajustes h2{font-family:var(--display);font-size:1.4rem;margin:0}
.ajustes .seccion p{margin:0;font-size:.92rem}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,16,12,.55);display:flex;align-items:flex-end;justify-content:center}
.hoja{background:var(--paper);width:100%;max-width:460px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:600px){.modal{align-items:center;padding:16px}.hoja{border-radius:20px;padding:22px}}
.hoja h2{font-family:var(--display);font-size:1.3rem;margin:0}
.hoja .sub{color:var(--muted);margin:0;font-size:.9rem}
.cab-modal{display:flex;gap:12px;align-items:center}
.cab-modal>div{min-width:0}
.pantalla{background:var(--paper-2);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.pantalla .grande{font-family:var(--display);font-size:2.3rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;text-align:right;overflow-wrap:anywhere}
.pantalla .chico{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;min-height:1.4em}
.pantalla.alerta .chico{color:var(--bad);font-weight:700}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.teclado button{min-height:54px;border-radius:12px;background:var(--paper-2);font-family:var(--display);font-size:1.4rem;font-weight:700;text-align:center}
.teclado button:active{background:var(--accent-soft)}
.teclado button.sec{font-size:1.1rem;color:var(--muted)}
.rapidos{display:flex;gap:6px;flex-wrap:wrap}
.rapidos button{padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:.9rem;background:var(--paper);text-align:center}
.rapidos button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pin-puntos{display:flex;gap:14px;justify-content:center;padding:8px}
.pin-puntos i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:block}
.pin-puntos i.lleno{background:var(--accent);border-color:var(--accent)}
.pin-puntos.mal i{border-color:var(--bad);animation:tiembla .3s}
@keyframes tiembla{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.galeria{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:280px;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--ground)}
.galeria button{display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:10px;background:var(--paper);border:2px solid transparent;padding:6px 4px 5px;font-size:.68rem;font-weight:700;color:var(--muted);text-align:center;line-height:1.1;min-width:0}
.galeria button svg{width:100%;height:auto;aspect-ratio:1;display:block}
.galeria button span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.galeria button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.galeria svg [class^="anim-"]{animation:none}
.emojis{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.emojis button{aspect-ratio:1;border-radius:10px;background:var(--paper-2);border:2px solid transparent;font-size:1.5rem;line-height:1;display:grid;place-items:center}
.emojis button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.emoji-input{font-size:1.6rem;text-align:center}
.foto-zona{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.vista-previa{display:flex;gap:12px;align-items:center}
.vista-previa .ilus{width:72px}
.archivo{display:inline-flex}

.hoja form{display:flex;flex-direction:column;gap:12px}
.campo input[type="file"]{padding:8px;background:var(--paper);min-height:44px}

/* ---------- Red, venta hecha, WhatsApp, catálogo ---------- */
.red{background:var(--money-soft);color:var(--ink);font-size:.85rem;font-weight:700;text-align:center;padding:6px 12px;border-bottom:1px solid var(--money);flex:none}
.red.mal{background:color-mix(in srgb,var(--bad) 14%,var(--paper));border-color:var(--bad)}
.hecho{display:flex;flex-direction:column;gap:14px;text-align:center}
.hecho-icono{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:1.8rem;font-weight:800;margin:0 auto}
.hecho .pantalla .grande,.hecho .pantalla .chico{text-align:center}
.hecho .cambio{color:var(--accent);font-size:2.8rem}
.hecho .campo{text-align:left}
a.btn{text-decoration:none}
.btn.wa{background:#25D366;color:#0B2B1A}
button,a.btn{-webkit-tap-highlight-color:transparent}
.buscar{position:sticky;top:0;z-index:2;background:var(--ground);padding-block:2px}
.tarjeta .desc{font-size:.75rem;color:var(--muted);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-2px}
.prod-celda{white-space:normal}
.prod-celda .desc{display:block;font-weight:400;font-size:.75rem;color:var(--muted)}
.lbl-cel{display:none}
.filtro-tabla{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.filtro-tabla input{flex:1;min-width:160px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--ground);min-height:42px}
.filtro-tabla .cuenta{font-size:.85rem;color:var(--muted);white-space:nowrap}
.tk-acciones{display:flex;justify-content:flex-end;padding:6px 0 2px}
.casilla{display:flex;align-items:center;gap:8px;font-size:.9rem}
.casilla input{width:20px;height:20px;min-height:0;padding:0}
@media (max-width:640px){
  .tabla-carga thead{display:none}
  .tabla-carga,.tabla-carga tbody{display:block}
  .tabla-carga tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
  .tabla-carga td{display:block;padding:0;border:0;text-align:left}
  .tabla-carga td:nth-child(1){grid-column:1;grid-row:1}
  .tabla-carga td:nth-child(7){grid-column:2;grid-row:1;justify-self:end}
  .tabla-carga td:nth-child(2){grid-column:1;grid-row:2}
  .tabla-carga td:nth-child(3){grid-column:2;grid-row:2}
  .tabla-carga td:nth-child(4){grid-column:1;grid-row:3}
  .tabla-carga td:nth-child(6){grid-column:2;grid-row:3;align-self:end;padding-bottom:10px}
  .tabla-carga td:nth-child(5){grid-column:1/-1;grid-row:4}
  .celda-input.doble input{width:auto;flex:1;min-width:0}
  .lbl-cel{display:block;font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
  .celda-input{width:100%;justify-content:space-between}
  .celda-input input{width:100%;text-align:left}
}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center;font-size:.95rem}
</style>
</head>

  const v2 = [L('Sandía', 4.3), L('Cilantro', 2)];
  const hoyV = [
    {id: uid(), ts: a(9, 12), lineas: v1, total: r2(v1.reduce((s, l) => s + l.importe, 0)), recibido: 200},
    {id: uid(), ts: a(10, 41), lineas: v2, total: r2(v2.reduce((s, l) => s + l.importe, 0)), recibido: 100}
  ];
  hoyV.forEach(v => { v.cambio = r2(v.recibido - v.total); v.lineas.forEach(l => movimientos.push({id: uid(), ts: v.ts, tipo: 'venta', pid: l.pid, nombre: l.nombre, cantidad: l.cantidad, unidad: l.unidad, nota: ''})); });
  return {negocio: {nombre: 'Mi verdulería', moneda: '$', pin: '', ejemplo: true}, productos, movimientos, ventas: ventasSemillaSemana(productos).concat(hoyV)};
}
function ventasSemillaSemana(productos){
  let sem = 20260925;
  const rnd = () => { sem = (sem * 1103515245 + 12345) % 2147483648; return sem / 2147483648; };
  const disponibles = productos.filter(p => p.activo);
  const ventas = [];
  for (let d = 6; d >= 1; d--) {
    const base = new Date(); base.setHours(0, 0, 0, 0); base.setDate(base.getDate() - d);
    const n = 3 + Math.floor(rnd() * 4);
    for (let i = 0; i < n; i++) {
      const ts = base.getTime() + (8 + Math.floor(rnd() * 10)) * 3600000 + Math.floor(rnd() * 60) * 60000;
      const k = 1 + Math.floor(rnd() * 3); const lineas = []; const usados = new Set();
      for (let j = 0; j < k; j++) {
        const p = disponibles[Math.floor(rnd() * disponibles.length)]; if (usados.has(p.id)) continue; usados.add(p.id);
        const cantidad = cantidadEjemplo(p, rnd);
        lineas.push({pid: p.id, nombre: p.nombre, cantidad, unidad: p.unidad, precio: p.precio, importe: r2(cantidad * p.precio), mayoreo: false});
      }
      const total = r2(lineas.reduce((a, l) => a + l.importe, 0)); const recibido = Math.ceil(total / 50) * 50;
      ventas.push({id: uid(), ts, lineas, total, recibido, cambio: r2(recibido - total)});
    }
  }
  return ventas;
}

function resumenDeVentas(ventas, iso){
  const r = {iso, tickets: 0, total: 0, kg: 0};
  ventas.forEach(v => { if (fechaLocal(v.ts) !== iso) return; r.tickets++; r.total += v.total; v.lineas.forEach(l => { if (l.unidad === 'kg') r.kg += l.cantidad; }); });

function topDeVentas(ventas, desde){
  const top = {};
  ventas.forEach(v => { if (fechaLocal(v.ts) < desde) return; v.lineas.forEach(l => { const k = l.nombre; top[k] = top[k] || {nombre: l.nombre, unidad: l.unidad, cantidad: 0, importe: 0}; top[k].cantidad = r3(top[k].cantidad + l.cantidad); top[k].importe = r2(top[k].importe + l.importe); }); });
  return Object.values(top).sort((a, b) => b.importe - a.importe).slice(0, 6);

function diaCorto(iso){ const [a, m, d] = iso.split('-').map(Number); return new Date(a, m - 1, d).toLocaleDateString('es-MX', {weekday: 'short'}).replace('.', ''); }
function pasoBonito(x){ if (x <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(x))); const f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function etiquetaEje(v){ return v >= 1000 ? esc(moneda()) + (v / 1000).toLocaleString('es-MX', {maximumFractionDigits: 1}) + 'k' : esc(moneda()) + v; }
function graficaSemanaHTML(dias){
  const W = 640, H = 220, padL = 52, padR = 12, padT = 22, padB = 30;
  const max = Math.max(1, ...dias.map(d => d.total));
  const paso = pasoBonito(max / 3); const top = Math.ceil(max / paso) * paso;
  const y = v => padT + (H - padT - padB) * (1 - v / top);
  const n = dias.length; const ancho = (W - padL - padR) / n; const bw = Math.min(44, ancho * 0.56); const r = 4;
  let grid = '', barras = '', ejes = '';
  for (let v = 0; v <= top + 1e-9; v += paso) grid += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" class="g-linea"/><text x="${padL - 8}" y="${y(v) + 4}" class="g-eje" text-anchor="end">${etiquetaEje(Math.round(v * 100) / 100)}</text>`;
  dias.forEach((d, i) => {
    const cx = padL + ancho * i + ancho / 2; const x0 = cx - bw / 2; const base = y(0); const yt = y(d.total); const alto = base - yt; const esHoy = i === n - 1;
    const path = alto > r ? `M${x0} ${base}V${yt + r}a${r} ${r} 0 0 1 ${r} -${r}h${bw - 2 * r}a${r} ${r} 0 0 1 ${r} ${r}V${base}Z` : `M${x0} ${base}h${bw}v-${Math.max(alto, 1.5)}h-${bw}Z`;
    barras += `<g class="g-barra${esHoy ? ' hoy' : ''}" data-tip="${esc(fechaTxt(d.iso))}: ${dinero(d.total)} · ${d.tickets} ${d.tickets === 1 ? 'ticket' : 'tickets'} · ${trim3(d.kg)} kg"><rect x="${padL + ancho * i}" y="${padT}" width="${ancho}" height="${H - padT - padB}" class="g-hit"/><path d="${path}"/>${esHoy && d.total > 0 ? `<text x="${cx}" y="${yt - 7}" class="g-valor" text-anchor="middle">${dinero(d.total)}</text>` : ''}</g>`;
    ejes += `<text x="${cx}" y="${H - 10}" class="g-eje${esHoy ? ' fuerte' : ''}" text-anchor="middle">${esHoy ? 'hoy' : diaCorto(d.iso)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="grafica" role="img" aria-label="Ventas de los últimos 7 días">${grid}<line x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}" class="g-base"/>${barras}${ejes}</svg>`;

function vistaCorte(){
  const dia = corteDia || hoy();
  const ventas = estado.ventas.filter(v => fechaLocal(v.ts) === dia).sort((a, b) => b.ts - a.ts);
  const total = r2(ventas.reduce((s, v) => s + v.total, 0));
  const porProd = {};
  let kgTotal = 0;
  let conCosto = false;
  ventas.forEach(v => v.lineas.forEach(l => {
    const k = l.nombre; porProd[k] = porProd[k] || {nombre: l.nombre, unidad: l.unidad, cantidad: 0, importe: 0, ganancia: 0};
    porProd[k].cantidad = r3(porProd[k].cantidad + l.cantidad); porProd[k].importe = r2(porProd[k].importe + l.importe);
    if (l.costo > 0) { conCosto = true; porProd[k].ganancia = r2(porProd[k].ganancia + l.importe - l.cantidad * l.costo); }
    if (l.unidad === 'kg') kgTotal += l.cantidad;

    <div class="seccion"><h3>Por producto</h3>${filasProd.length ? `<div class="tabla-wrap"><table><thead><tr><th>Producto</th><th class="num">Vendido</th><th class="num">Importe</th>${conCosto ? '<th class="num">Ganancia</th>' : ''}</tr></thead><tbody>${filasProd.map(f => `<tr><td>${esc(f.nombre)}</td><td class="num">${cantidadTxt(f.cantidad, f.unidad)}</td><td class="num">${dinero(f.importe)}</td>${conCosto ? `<td class="num">${dinero(f.ganancia)}</td>` : ''}</tr>`).join('')}</tbody></table></div>` : `<div class="vacio">No hubo ventas este día.</div>`}</div>
    <div class="seccion"><h3>Tickets</h3>${ventas.length ? ventas.map(v => `<details class="tk"><summary><span class="hora">${horaTxt(v.ts)}</span><span class="muted">${v.lineas.length} art.</span><span class="tot">${dinero(v.total)}</span></summary>${v.lineas.map(l => `<div class="linea"><div>${esc(l.nombre)} <span class="q">${cantidadTxt(l.cantidad, l.unidad)} × ${dinero(l.precio)}${l.mayoreo ? ' · mayoreo' : ''}</span></div><div class="imp">${dinero(l.importe)}</div><span></span></div>`).join('')}<div class="linea"><div class="q">Recibido ${dinero(v.recibido)} · Cambio ${dinero(v.cambio)}</div><span></span><span></span></div><div class="tk-acciones"><a class="btn chico wa" href="${enlaceWA(textoTicket(v))}" target="_blank" rel="noopener">Enviar por WhatsApp</a></div></details>`).join('') : `<div class="vacio">Sin tickets.</div>`}</div>

function teclear(v, obj, o){
  let t = obj.texto;
  if (v === 'del') t = t.slice(0, -1);
  else if (v === '.') { if (o.sinPunto || t.includes('.')) return; t = (t || '0') + '.'; }
  else {
    if (t === '0') t = '';
    const dec = t.includes('.') ? t.split('.')[1].length : -1;
    if (dec >= o.decimales) return;
    if (t.replace('.', '').length >= 7) return;
    t += v;
  }
  obj.texto = t;
}

/* ---- Pesar ---- */
function precioPesa(p, cantidad){
  if (!tieneMayoreo(p)) return {precio: p.precio, mayoreo: false};
  const usar = pesa.mayoreo === true || (pesa.mayoreo === null && cantidad >= p.mayoreo_desde);
  return {precio: usar ? p.precio_mayoreo : p.precio, mayoreo: usar};
}
function calcPesa(p){
  const t = num(pesa.texto);
  if (pesa.modo === 'dinero' && p.unidad === 'kg') {
    const importe = r2(t);
    const pr = precioPesa(p, p.precio > 0 ? importe / p.precio : 0);
    return {cantidad: pr.precio > 0 ? r3(importe / pr.precio) : 0, importe, precio: pr.precio, mayoreo: pr.mayoreo};
  }
  const cantidad = p.unidad !== 'kg' ? Math.floor(t) : (pesa.gramos ? r3(t / 1000) : r3(t));
  const pr = precioPesa(p, cantidad);
  return {cantidad, importe: r2(cantidad * pr.precio), precio: pr.precio, mayoreo: pr.mayoreo};
}
function pesarHTML(){
  const p = prod(pesa.pid);
  const {cantidad, importe, precio, mayoreo} = calcPesa(p);
  const esKg = p.unidad === 'kg';
  const quedan = Math.max(0, p.existencia);
  const falta = cantidad > 0 && cantidad > p.existencia;
  let rapidos;
  if (!esKg) rapidos = [1, 2, 3, 6, 12].map(v => `<button type="button" data-accion="pesa-rapido" data-v="${v}">${v} ${unidadCorta(p.unidad)}</button>`).join('');

function leerFoto(file, cb){
  if (!file || !file.type.startsWith('image/')) { toast('Elige una imagen'); return; }
  if (file.type === 'image/gif' && file.size < 400 * 1024) { const r = new FileReader(); r.onload = () => cb(r.result); r.readAsDataURL(file); return; }
  const url = URL.createObjectURL(file); const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
    const s = Math.min(img.width, img.height); x.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 256, 256);
    URL.revokeObjectURL(url); cb(c.toDataURL('image/jpeg', .82));
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('No se pudo leer la imagen'); };
  img.src = url;
}

/* ================= Servidor: llamadas, sesión, cola y sincronía ================= */
async function llamar(metodo, ruta, cuerpo){
  const cab = {'Content-Type': 'application/json'}; if (sesion) cab['X-Sesion'] = sesion;
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 12000);
  try {
    const r = await fetch(API + ruta, {method: metodo, headers: cab, body: cuerpo === undefined ? undefined : JSON.stringify(cuerpo), signal: ctrl.signal, cache: 'no-store'});
    clearTimeout(t);
    let datos = null; try { datos = await r.json(); } catch (e) {}
    return {ok: r.ok, status: r.status, datos};
  } catch (e) { clearTimeout(t); return {ok: false, status: 0, datos: null}; }
}
function marcarRed(ok){ enLinea = ok; pintarRed(); }
function pintarRed(){
  const el = $('#red'); if (!el) return;
  const n = cola.length;
  if (MODO !== 'servidor' || !perfil || (enLinea && !n)) { el.hidden = true; return; }
  el.hidden = false;
  el.textContent = !enLinea ? (n ? `Sin señal · ${n} ${n === 1 ? 'venta guardada' : 'ventas guardadas'} en este teléfono, se envían al volver la señal` : 'Sin señal: las ventas se guardan en este teléfono y se envían al volver la señal')
                            : `Enviando ${n} ${n === 1 ? 'venta pendiente' : 'ventas pendientes'}…`;
  el.classList.toggle('mal', !enLinea);
}
function adoptar(datos){
  if (datos && datos.version) recargarSiNueva(datos.version);
  if (!datos || !Array.isArray(datos.productos)) return;
  estado = datos; migrar();
  if (Array.isArray(datos.sucursales)) sucursales = datos.sucursales;
  const base = rutaBase();
  cola.forEach(x => { if (x.ruta.startsWith(base + '/') && !estado.ventas.some(v => v.id === x.venta.id)) aplicarVentaLocal(x.venta); });
  guardar();
}
function cerrarSesion(msg){
  sesion = ''; escribirLS(CLAVE_SESION, null); cuenta = null; sucursales = []; dashTodas = false; resumen = null;
  guardarPerfil(null); estado = estadoVacio(); ticket = []; cerrarModal(); render(); pintarRed();
  if (msg) toast(msg);
}
function perderCaja(msg){
  claveCaja = ''; escribirLS(CLAVE_CAJA, null); guardarPerfil(null); estado = estadoVacio(); cerrarModal(); render(); pintarRed();
  if (msg) toast(msg);
}
/* Operación de dirección o ajustes. op = {metodo, ruta, cuerpo, absoluta, local()}; devuelve los datos (o true) si quedó hecha. */
async function ejecutar(op){
  if (MODO === 'local') { const err = op.local ? op.local() : null; if (err) { toast(err); return false; } guardar(); return true; }
  const r = await llamar(op.metodo || 'POST', (op.absoluta ? '' : rutaBase()) + op.ruta, op.cuerpo);
  if (r.status === 0) { marcarRed(false); toast('Sin señal. Inténtalo otra vez cuando vuelva.'); return false; }
  marcarRed(true);
  if (r.status === 401) { cerrarSesion('Vuelve a entrar con tu correo y contraseña'); return false; }

async function enviarVenta(venta){

async function enviarCola(){
  if (MODO !== 'servidor' || !cola.length || sincronizando) return;
  sincronizando = true; let cambio = false;
  try {
    for (let i = 0; i < cola.length;) {
      const x = cola[i]; const r = await llamar('POST', x.ruta, x.venta);
      if (r.status === 0) { marcarRed(false); break; }
      marcarRed(true);
      if (r.status === 401 || r.status === 404) { i++; continue; }   // se reintenta cuando el dueño entre o llegue la clave nueva
      cola.splice(i, 1); escribirLS(CLAVE_COLA, JSON.stringify(cola)); cambio = true;

}

        if (it.precio !== '') { const v = r2(Math.max(0, num(it.precio))); if (v !== p.precio) p.precio = v; }
        if (it.costo !== '') p.costo = r2(Math.max(0, num(it.costo)));
        if (it.precio_mayoreo !== undefined) { p.precio_mayoreo = it.precio_mayoreo; p.mayoreo_desde = it.mayoreo_desde; }
        if (it.existencia !== '') {
          const v = r3(Math.max(0, num(it.existencia)));
          if (v !== r3(Math.max(0, p.existencia))) {
            const delta = r3(v - p.existencia); p.existencia = v; p.declarado = v;
            estado.movimientos.push({id: uid(), ts, tipo: delta > 0 ? 'entrada' : 'ajuste', pid: p.id, nombre: p.nombre, cantidad: delta, unidad: p.unidad, nota: 'Carga desde Dirección'});
          }
        }
      });
    }});
    if (ok) { render(); toast('Precios y stock guardados'); }
  },
  editar: async () => {
    sincronizarEdicion(); const e = edicion;
    const nombre = e.nombre.trim(); const precio = r2(num(e.precio));
    if (!nombre) { toast('Ponle nombre al producto'); return; }
    if (e.tipo === 'ilus') { e.emoji = ''; e.foto = ''; } else if (e.tipo === 'emoji') { e.foto = ''; }
    const datos = {nombre, descripcion: (e.descripcion || '').trim(), unidad: e.unidad, precio, costo: r2(Math.max(0, num(e.costo))), precio_mayoreo: r2(Math.max(0, num(e.precio_mayoreo))), mayoreo_desde: r3(Math.max(0, num(e.mayoreo_desde))), ilus: e.ilus, emoji: e.emoji, foto: e.foto};
    const ok = await ejecutar(e.id
      ? {metodo: 'PUT', ruta: `/productos/${e.id}`, cuerpo: datos, local: () => { Object.assign(prod(e.id), datos); }}
      : {ruta: '/productos', cuerpo: datos, local: () => { estado.productos.push(Object.assign({id: uid(), activo: true, declarado: 0, existencia: 0}, datos)); }});
    if (ok) { cerrarModal(); render(); toast(e.id ? 'Producto actualizado' : 'Producto creado. Cárgale precio y stock.'); }
  },
  negocio: async () => {
    const pinTxt = $('#aj-pin').value.trim(); const quitar = !!($('#aj-quitar-pin') && $('#aj-quitar-pin').checked);
    if (pinTxt && !/^\d{4}$/.test(pinTxt)) { toast('El PIN son 4 números'); return; }
    const nombre = $('#aj-nombre').value.trim() || 'Mi verdulería'; const mon = $('#aj-moneda').value.trim() || '$';
    const ok = await ejecutar({local: () => {
      estado.negocio.nombre = nombre; estado.negocio.moneda = mon;
      if (quitar) estado.negocio.pin = ''; else if (pinTxt) { estado.negocio.pin = pinTxt; desbloqueado = true; }
    }});
    if (ok) { render(); toast('Ajustes guardados'); }
  }
};

/* ================= Eventos ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-accion]');
  if (b) { const fn = acciones[b.dataset.accion]; if (fn) fn(b.dataset, b, e); return; }
  if (e.target.id === 'modal') cerrarModal();
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault(); const fn = formularios[f.dataset.form]; if (fn) fn(f);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'buscar') { filtro = t.value; const w = $('#rejilla-wrap'); if (w) w.innerHTML = rejillaHTML(); }
  else if (t.id === 'filtro-carga') { const q = t.value.trim().toLowerCase(); $$('.tabla-carga tbody tr').forEach(tr => { tr.hidden = !!q && !tr.dataset.nombre.includes(q); }); }
  else if (t.id === 'ed-emoji' || t.id === 'ed-nombre') { sincronizarEdicion(); if (t.id === 'ed-emoji' && edicion.emoji) edicion.foto = ''; pintarVistaPrevia(); }
  else if (t.id === 'wa-tel' && ultimaVenta) { const a = $('#wa-enlace'); if (a) a.href = enlaceWA(textoTicket(ultimaVenta), t.value); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'corte-dia') { corteDia = t.value || null; render(); }
  else if (t.id === 'sel-sucursal') { if (t.value === 'nueva') { t.value = sucursalId; abrirModal('sucursal-nueva'); } else cambiarSucursal(t.value); }
  else if (t.id === 'ed-unidad') { const l = $('label[for="ed-desde"]'); if (l) l.textContent = 'Mayoreo a partir de (' + unidadPlural(t.value) + ')'; }
  else if (t.id === 'ent-prod') { const p = prod(t.value); const u = $('#ent-unidad'); if (p && u) u.textContent = unidadPlural(p.unidad); }
  else if (t.id === 'ed-foto') { const f = t.files && t.files[0]; if (!f) return; sincronizarEdicion(); leerFoto(f, url => { edicion.foto = url; edicion.emoji = ''; pintarModal(); }); }
  else if (t.id === 'aj-archivo') { const f = t.files && t.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { const ta = $('#aj-respaldo'); if (ta) ta.value = r.result; restaurar(r.result); }; r.readAsText(f); t.value = ''; }
});
document.addEventListener('pointerover', e => {
  const t = e.target.closest ? e.target.closest('[data-tip]') : null; const tip = $('#tip');
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.dataset.tip; tip.hidden = false;
  const r = t.getBoundingClientRect();
  tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, Math.max(8, r.left + r.width / 2 - tip.offsetWidth / 2)) + 'px';
  tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + 'px';
});
document.addEventListener('pointerout', e => {
  const t = e.target.closest ? e.target.closest('[data-tip]') : null;
  if (t && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-tip]') === t)) $('#tip').hidden = true;
});
document.addEventListener('keydown', e => {
  if (!modalActual) return;
  if (e.key === 'Escape') { cerrarModal(); return; }
  if (modalActual !== 'pesar' && modalActual !== 'cobrar' && modalActual !== 'pin') return;
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  let v = null;
  if (/^[0-9]$/.test(e.key)) v = e.key;
  else if (e.key === '.' || e.key === ',') v = '.';
  else if (e.key === 'Backspace') v = 'del';
  else if (e.key === 'Enter') { e.preventDefault(); if (modalActual === 'pesar') agregarLinea(); else if (modalActual === 'cobrar') confirmarVenta(); return; }
  if (v !== null) { e.preventDefault(); acciones.tecla({v}); }
});

/* ================= Arranque ================= */
async function start(hot){
  try { cola = JSON.parse(leerLS(CLAVE_COLA) || '[]'); if (!Array.isArray(cola)) cola = []; } catch (e) { cola = []; }
  cola = cola.filter(x => x && x.venta && x.ruta);
  sesion = leerLS(CLAVE_SESION) || ''; claveCaja = leerLS(CLAVE_CAJA) || ''; sucursalId = leerLS(CLAVE_SUC) || '';
  const guardado = leerLS(CLAVE_PERFIL);
  perfil = guardado === 'caja' || guardado === 'direccion' ? guardado : null;
  let cajaURL = '';
  try { cajaURL = (new URLSearchParams(location.search).get('caja') || '').trim().toUpperCase(); } catch (e) {}
  if (cajaURL) { claveCaja = cajaURL; escribirLS(CLAVE_CAJA, claveCaja); perfil = 'caja'; escribirLS(CLAVE_PERFIL, 'caja'); try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {} }
  const r = await llamar('GET', '/estado');
  if (r.ok && r.datos && r.datos.servidor) {
    MODO = 'servidor'; escribirLS(CLAVE_MODO, 'servidor'); altaAbierta = r.datos.alta_abierta !== false; recargarSiNueva(r.datos.version);
    if (perfil === 'direccion') { if (!sesion || !(await cargarCuenta()) || !(await cargarEstadoSucursal())) perfil = null; }
    else if (perfil === 'caja') { if (!claveCaja || !(await cargarEstadoCaja())) perfil = null; }
    if (!perfil) { escribirLS(CLAVE_PERFIL, null); estado = estadoVacio(); }
  } else if ((r.status === 0 || r.status >= 500) && leerLS(CLAVE_MODO) === 'servidor') {
    MODO = 'servidor'; enLinea = false;
    try { estado = JSON.parse(leerLS(CLAVE_CACHE) || 'null'); } catch (e) { estado = null; }
    if (!estado || !Array.isArray(estado.productos)) estado = estadoVacio();
    migrar();
    if (perfil === 'direccion' && !sesion) perfil = null;
    if (perfil === 'caja' && !claveCaja) perfil = null;
    if (perfil) { const base = rutaBase(); cola.forEach(x => { if (x.ruta.startsWith(base + '/') && !estado.ventas.some(v => v.id === x.venta.id)) aplicarVentaLocal(x.venta); }); }
  } else {
    MODO = 'local'; escribirLS(CLAVE_MODO, null);
    estado = cargarLocal() || semilla(); migrar();
    desbloqueado = !!leerLS(CLAVE_TOKEN);
    if (perfil === 'direccion' && tienePin() && !abierto()) perfil = null;
  }
  const lm = document.querySelector('link[rel="manifest"]');
  if (lm && MODO === 'servidor' && claveCaja) lm.setAttribute('href', 'manifest.webmanifest?caja=' + claveCaja);
  const h = (location.hash || '').slice(1);
  if (VISTAS.includes(h)) vista = h;
  if (hot && typeof hot === 'object') { if (Array.isArray(hot.ticket)) ticket = hot.ticket; if (VISTAS.includes(hot.vista)) vista = hot.vista; }
  if (perfil !== 'direccion') vista = 'vender';
  render(); pintarRed();
  if (MODO === 'servidor') {
    setInterval(sincronizar, 15000); setInterval(enviarCola, 10000);
    window.addEventListener('online', () => { enviarCola(); sincronizar(); });
    window.addEventListener('focus', () => { enviarCola(); sincronizar(); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { enviarCola(); sincronizar(); } });
    enviarCola();
  }
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
}
const H = window.claude && window.claude.hot;
if (H && typeof H.ready === 'function') H.ready(start); else start(H && H.data);
})();
</script>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operador · Verdulería al Peso</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F3F6EC;--paper:#FFFFFF;--paper-2:#F7F9F2;--ink:#16201A;--muted:#46534A;--line:#D9E1CE;
  --accent:#2A8A4C;--accent-ink:#FFFFFF;--accent-soft:#DAEFDF;--bar:#B9DEC4;
  --ok:#1F7A3F;--ok-soft:#DAEFDF;--warn:#9A5B00;--warn-soft:#FBEBC8;--bad:#B83232;--bad-soft:#FBE1E1;--off:#6B786F;--off-soft:#ECEFE8;
  --shadow:0 1px 2px rgba(27,38,30,.05),0 6px 20px rgba(27,38,30,.06);
  --display:"Bricolage Grotesque","Trebuchet MS",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#111813;--paper:#1A231D;--paper-2:#202A23;--ink:#EAF0E5;--muted:#A9B6AC;--line:#2D3A31;
  --accent:#4DB877;--accent-ink:#0E1A12;--accent-soft:#1E3627;--bar:#2E5A3D;
  --ok:#5CC786;--ok-soft:#1E3627;--warn:#E2B23C;--warn-soft:#3A2E12;--bad:#EE7B7B;--bad-soft:#3D1D1D;--off:#8C998F;--off-soft:#26302A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --ground:#111813;--paper:#1A231D;--paper-2:#202A23;--ink:#EAF0E5;--muted:#A9B6AC;--line:#2D3A31;
  --accent:#4DB877;--accent-ink:#0E1A12;--accent-soft:#1E3627;--bar:#2E5A3D;
  --ok:#5CC786;--ok-soft:#1E3627;--warn:#E2B23C;--warn-soft:#3A2E12;--bad:#EE7B7B;--bad-soft:#3D1D1D;--off:#8C998F;--off-soft:#26302A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:1080px;margin:0 auto;padding:28px 16px 64px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
.meta{color:var(--muted);font-size:.92rem}
button{font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
button.prim{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* entrada */
.entrar{max-width:380px;margin:12vh auto 0;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
.entrar h1{font-size:1.7rem;margin-bottom:4px}.entrar p{margin:0 0 18px}
.entrar input{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper-2);color:var(--ink);margin-bottom:12px}
.entrar button{width:100%}
.error{color:var(--bad);font-weight:700;margin:12px 0 0}

/* encabezado */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.top h1{font-size:2rem}.top .acciones{display:flex;gap:8px}

/* cifras */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.kpi .et{display:block;color:var(--muted);font-size:.9rem;font-weight:700}
.kpi .v{display:block;font-family:var(--display);font-weight:800;font-size:1.65rem;line-height:1.25;margin:2px 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{display:block;color:var(--muted);font-size:.88rem}
.kpi.dest{background:var(--accent-soft);border-color:transparent}
.resumen{margin-bottom:26px}

/* cuenta */
.cuenta{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin:0 0 22px;overflow:hidden}
.c-head{display:flex;gap:14px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.avatar{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--ok);font-family:var(--display);font-weight:800;font-size:1.3rem}
.c-tit{flex:1;min-width:0}
.c-tit h2{font-size:1.35rem;overflow-wrap:anywhere}
.c-tit .meta{overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:.85rem;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.off{background:var(--off-soft);color:var(--off)}
.chip.plano::before{display:none}
.c-total{padding:16px 20px;background:var(--paper-2);border-bottom:1px solid var(--line)}
.c-total h3{font-size:1rem;margin-bottom:10px;color:var(--muted)}

/* sucursal */
.suc{padding:18px 20px 20px}
.suc+.suc{border-top:1px solid var(--line)}
.s-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:12px}
.s-head h3{font-size:1.15rem}
.vacia{background:var(--paper-2);border:1px dashed var(--line);border-radius:12px;padding:14px 16px;color:var(--muted)}
.partes{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin-top:14px}
.caja{border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0;display:flex;flex-direction:column}
.caja.graf .grafica{flex:1}
.caja h4{margin:0 0 10px;font-size:1rem}

/* gráfica de 7 días */
.grafica{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;min-height:160px}
.dia{display:flex;flex-direction:column;align-items:center;height:100%;min-width:0}
.pista{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.dia .monto{font-size:.74rem;color:var(--muted);white-space:nowrap;margin-bottom:3px;font-variant-numeric:tabular-nums}
.dia .barra{width:100%;max-width:38px;background:var(--bar);border-radius:6px 6px 2px 2px;position:relative;overflow:hidden;min-height:2px}
.dia .barra i{position:absolute;left:0;right:0;bottom:0;background:var(--accent)}
.dia .barra.cero{background:var(--line)}
.dia .d{font-size:.8rem;color:var(--muted);margin-top:5px;white-space:nowrap}
.dia.hoy .d{color:var(--ink);font-weight:700}
.leyenda{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:.86rem;color:var(--muted)}
.leyenda span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--bar)}
.leyenda span.g::before{background:var(--accent)}

/* catálogo */
.fila{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.fila+.fila,.prog+.fila{margin-top:9px}
.fila b{font-variant-numeric:tabular-nums;white-space:nowrap}
.prog{height:6px;border-radius:99px;background:var(--off-soft);overflow:hidden;margin-top:5px}
.prog i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.prog.warn i{background:var(--warn)}
.sep{border:0;border-top:1px dashed var(--line);margin:12px 0}

/* avisos */
.aviso{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:.95rem}
.aviso.bad{background:var(--bad-soft);color:var(--ink)}.aviso.bad b{color:var(--bad)}
.aviso.warn{background:var(--warn-soft);color:var(--ink)}
.aviso ul{margin:6px 0 0;padding-left:20px}
.ok-t{color:var(--ok)}.warn-t{color:var(--warn)}.bad-t{color:var(--bad)}

@media (max-width:760px){.partes{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){
  body{font-size:16px}main{padding-top:18px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px}.kpi .v{font-size:1.3rem}
  .kpis.tres .kpi:last-child{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
  .kpis.tres .kpi:last-child .et{flex-basis:100%}
  .c-head{flex-wrap:wrap;padding:16px;gap:10px 12px}.c-tit{flex:1 1 calc(100% - 60px)}.c-head .chip{margin-left:58px}
  .avatar{width:40px;height:40px;font-size:1.1rem;align-self:flex-start}
  .suc,.c-total{padding:16px}
  .grafica{gap:4px}.dia .monto{font-size:.66rem}
}
</style>
</head>
<body><main>
<div id="entrar" class="entrar" hidden>
  <h1>Operador</h1>
  <p class="meta">Cómo van todas las verdulerías: ventas, ganancia y avance.</p>
  <form id="f"><input id="clave" type="password" placeholder="Clave de operador" autocomplete="current-password" aria-label="Clave de operador"><button class="prim">Entrar</button></form>
  <p id="error" class="error" hidden></p>
</div>
<div id="salida"></div>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const din=n=>'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const din0=n=>'$'+Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:0});
const corto=n=>n>=1000?'$'+(n/1000).toLocaleString('es-MX',{maximumFractionDigits:1})+'k':din0(n);
const unid=u=>({kg:'kg',pieza:'pza',manojo:'manojo'}[u]||u||'');
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'],DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
let HOY='',clave='';
const fechaUTC=iso=>new Date(iso.slice(0,10)+'T00:00:00Z');
const diasEntre=(a,b)=>Math.round((fechaUTC(b)-fechaUTC(a))/864e5);
// '2026-10-07 19:26' → «hoy 19:26», «ayer 08:10», «hace 3 días», «12 sep»
function cuando(f){
  if(!f)return null;
  const n=diasEntre(f,HOY),h=f.slice(11,16);
  if(n<=0)return `hoy ${h}`;if(n===1)return `ayer ${h}`;if(n<7)return `hace ${n} días`;
  const d=fechaUTC(f);return `${d.getUTCDate()} ${MESES[d.getUTCMonth()]}${d.getUTCFullYear()!==fechaUTC(HOY).getUTCFullYear()?' '+d.getUTCFullYear():''}`;
}
const pct=n=>Number(n).toLocaleString('es-MX',{maximumFractionDigits:1})+' %';
// Verdulería: arriba de 20 % va bien; abajo deja poco; en 0 o menos pierde.
const nivelMargen=m=>m==null?'off':m<=0?'bad':m<20?'warn':'ok';
const palabraMargen={ok:'Bueno',warn:'Bajo',bad:'Pierde',off:'Sin costos'};

function suma(sucs){
  return sucs.reduce((a,s)=>({total:a.total+s.ventas.total,con_costo:a.con_costo+s.ventas.con_costo,ganancia:a.ganancia+s.ventas.ganancia,
    tickets:a.tickets+s.ventas.tickets,hoy:a.hoy+s.ventas.hoy.total,ultima:[a.ultima,s.ventas.ultima].filter(Boolean).sort().pop()||null}),
    {total:0,con_costo:0,ganancia:0,tickets:0,hoy:0,ultima:null});
}
const margenDe=t=>t.con_costo>0?t.ganancia/t.con_costo*100:null;

function kpisVentas(t){
  const m=margenDe(t),nv=nivelMargen(m);
  const cobertura=t.con_costo>0&&t.con_costo<t.total-0.005?`de ${din0(t.con_costo)} vendidos con costo`:'precio menos costo';
  return `<div class="kpis tres">
    <div class="kpi"><span class="et">Vendido</span><span class="v">${din(t.total)}</span><span class="s">${t.tickets} ${t.tickets===1?'ticket':'tickets'} · hoy ${din0(t.hoy)}</span></div>
    <div class="kpi dest"><span class="et">Ganancia</span><span class="v">${t.con_costo>0?din(t.ganancia):'—'}</span><span class="s">${t.con_costo>0?cobertura:'aún no carga costos'}</span></div>
    <div class="kpi"><span class="et">Margen</span><span class="v ${nv}-t">${m==null?'—':pct(m)}</span><span class="chip ${nv} plano">${palabraMargen[nv]}</span></div>
  </div>`;
}

function estadoCuenta(t){
  if(!t.ultima)return '<span class="chip off">Nunca ha vendido</span>';
  const n=diasEntre(t.ultima,HOY);
  if(n<=0)return '<span class="chip ok">Vendió hoy</span>';
  if(n<=2)return `<span class="chip warn">Última venta ${cuando(t.ultima)}</span>`;
  return `<span class="chip bad">Sin vender hace ${n} días</span>`;
}

function grafica(s){
  const dias=[];for(let i=6;i>=0;i--){const d=new Date(fechaUTC(HOY)-i*864e5);dias.push(d)}
  const datos=dias.map(d=>{const k=d.toISOString().slice(0,10);return {d,k,...(s.ventas.por_dia[k]||{tickets:0,total:0,con_costo:0,ganancia:0})}});
  const max=Math.max(...datos.map(x=>x.total),0);
  const total7=datos.reduce((a,x)=>a+x.total,0),gan7=datos.reduce((a,x)=>a+x.ganancia,0),cc7=datos.reduce((a,x)=>a+x.con_costo,0);
  return `<div class="caja graf"><h4>Últimos 7 días</h4>
    <div class="grafica" role="img" aria-label="Ventas de los últimos 7 días">${datos.map(x=>{
      const h=max>0?Math.max(3,Math.round(x.total/max*80)):0,g=x.total>0?Math.max(0,Math.min(100,x.ganancia/x.total*100)):0;
      return `<div class="dia${x.k===HOY?' hoy':''}" title="${DIAS[x.d.getUTCDay()]} ${x.d.getUTCDate()}: ${din(x.total)} · ${x.tickets} tickets${x.con_costo>0?' · ganancia '+din(x.ganancia):''}">
        <div class="pista"><span class="monto">${x.total>0?corto(x.total):''}</span>
        <div class="barra${x.total>0?'':' cero'}" style="height:${x.total>0?h+'%':'2px'}"><i style="height:${g}%"></i></div></div>
        <span class="d">${x.k===HOY?'hoy':DIAS[x.d.getUTCDay()]+' '+x.d.getUTCDate()}</span></div>`;}).join('')}</div>
    <div class="leyenda"><span>Vendido ${din0(total7)}</span>${cc7>0?`<span class="g">Ganancia ${din0(gan7)}</span>`:''}</div>
  </div>`;
}

function catalogo(s){
  const p=s.productos,enc=p.encendidos;
  const barra=(n,de,aviso)=>`<div class="prog${aviso&&n<de?' warn':''}"><i style="width:${de>0?Math.round(n/de*100):0}%"></i></div>`;
  const ml=p.margen_promedio,nl=nivelMargen(ml);
  return `<div class="caja"><h4>Catálogo</h4>
    <div class="fila"><span>Productos encendidos</span><b>${enc} de ${p.total}</b></div>
    <div class="fila"><span>Con stock</span><b>${p.con_stock} de ${enc}</b></div>${barra(p.con_stock,enc)}
    <div class="fila"><span>Con costo</span><b>${p.con_costo} de ${enc}</b></div>${barra(p.con_costo,enc,true)}
    <div class="fila"><span>Margen de lista</span><b class="${nl}-t">${ml==null?'—':pct(ml)}</b></div>
    <div class="fila"><span>Por reponer</span><b class="${p.por_reponer?'warn-t':''}">${p.por_reponer}</b></div>
    <div class="fila"><span>Con mayoreo</span><b>${p.con_mayoreo}</b></div>
    <hr class="sep">
    <div class="fila"><span>Última venta</span><b class="${s.ventas.ultima?'':'bad-t'}">${cuando(s.ventas.ultima)||'ninguna'}</b></div>
    <div class="fila"><span>Última carga</span><b class="${s.cargas.ultima?'':'bad-t'}">${cuando(s.cargas.ultima)||'ninguna'}</b></div>
  </div>`;
}

function avisos(s){
  const p=s.productos,out=[];
  if(p.perdida&&p.perdida.length)out.push(`<div class="aviso bad"><b>${p.con_perdida===1?'1 producto se vende':p.con_perdida+' productos se venden'} con pérdida</b> (cuestan igual o más de lo que se cobran):
    <ul>${p.perdida.map(x=>`<li>${esc(x.nombre)}: cuesta ${din(x.costo)}/${unid(x.unidad)}, se vende a ${din(x.precio)}/${unid(x.unidad)}</li>`).join('')}</ul></div>`);
  if(p.encendidos>0&&p.con_costo<p.encendidos)out.push(`<div class="aviso warn">${p.encendidos-p.con_costo} de ${p.encendidos} productos encendidos no tienen costo: su venta no entra en la ganancia ni en el margen.</div>`);
  return out.join('');
}

function sucursal(s,sola){
  return `<section class="suc">
    <div class="s-head"><h3>${esc(s.nombre)}</h3>${s.ejemplo?'<span class="chip off plano">Datos de ejemplo</span>':''}<span class="meta">caja ${esc(s.clave_caja)} · creada ${cuando(s.creada)}</span></div>
    ${!s.ventas.tickets&&!s.productos.encendidos?`<div class="vacia">Aún no empieza: no tiene productos encendidos ni ventas. Última carga: ${cuando(s.cargas.ultima)||'ninguna'}.</div>`:`
    ${sola?'':kpisVentas(suma([s]))}
    <div class="partes">${grafica(s)}${catalogo(s)}</div>
    ${avisos(s)}`}
  </section>`;
}

function cuenta(c){
  const t=suma(c.sucursales),sola=c.sucursales.length===1;
  return `<article class="cuenta">
    <div class="c-head"><div class="avatar" aria-hidden="true">${esc((c.nombre||'?').trim().charAt(0).toUpperCase())}</div>
      <div class="c-tit"><h2>${esc(c.nombre)}</h2><div class="meta">${esc(c.correo)}${c.con_google?' · con Google':''} · cliente desde ${cuando(c.creada)} · entró a Dirección ${cuando(c.ultima_entrada)||'nunca'}</div></div>
      ${estadoCuenta(t)}</div>
    ${t.tickets?`<div class="c-total">${sola?'':`<h3>Total de ${c.sucursales.length} sucursales</h3>`}${kpisVentas(t)}</div>`:''}
    ${c.sucursales.map(s=>sucursal(s,sola)).join('')||'<section class="suc meta">Sin sucursales.</section>'}
  </article>`;
}

function pintar(d){
  HOY=d.hoy;
  const todas=d.cuentas.flatMap(c=>c.sucursales),t=suma(todas),m=margenDe(t);
  const hoyVendieron=d.cuentas.filter(c=>c.sucursales.some(s=>s.ventas.hoy.tickets>0)).length;
  $('#salida').innerHTML=`<div class="top"><div><h1>Operador</h1><div class="meta">${DIAS[fechaUTC(HOY).getUTCDay()]} ${fechaUTC(HOY).getUTCDate()} ${MESES[fechaUTC(HOY).getUTCMonth()]} · versión ${esc(d.version)}</div></div>
      <div class="acciones"><button id="act">Actualizar</button><button id="salir">Salir</button></div></div>
    <div class="kpis resumen">
      <div class="kpi"><span class="et">Cuentas</span><span class="v">${d.cuentas.length}</span><span class="s">${hoyVendieron} vendieron hoy</span></div>
      <div class="kpi"><span class="et">Vendido hoy</span><span class="v">${din(t.hoy)}</span><span class="s">entre todas</span></div>
      <div class="kpi"><span class="et">Vendido en total</span><span class="v">${din(t.total)}</span><span class="s">${t.tickets} tickets</span></div>
      <div class="kpi dest"><span class="et">Ganancia en total</span><span class="v">${t.con_costo>0?din(t.ganancia):'—'}</span><span class="s">${m==null?'nadie ha cargado costos':'margen '+pct(m)}</span></div>
    </div>
    ${d.cuentas.map(cuenta).join('')||'<p class="meta">Todavía no hay cuentas.</p>'}`;
  $('#act').onclick=()=>cargar(clave);
  $('#salir').onclick=()=>{try{localStorage.removeItem('operador.clave')}catch(e){};clave='';$('#salida').innerHTML='';$('#clave').value='';$('#entrar').hidden=false};
}

async function cargar(c){
  let r;try{r=await fetch('api/operador',{headers:{'X-Operador':c},cache:'no-store'})}catch(e){r=null}
  if(!r||!r.ok){$('#entrar').hidden=false;$('#salida').innerHTML='';const e=$('#error');e.textContent=r?'Clave incorrecta o servidor sin CLAVE_OPERADOR.':'Sin conexión con el servidor.';e.hidden=false;return;}
  clave=c;try{localStorage.setItem('operador.clave',c)}catch(e){}
  $('#entrar').hidden=true;$('#error').hidden=true;pintar(await r.json());
}
$('#f').addEventListener('submit',e=>{e.preventDefault();cargar($('#clave').value.trim())});
